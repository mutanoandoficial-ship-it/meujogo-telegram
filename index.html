<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔥 Gerador de Nicks FF</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --fire: #ff4500;
    --gold: #ffd700;
    --dark: #0a0a0f;
    --card: #12121a;
    --border: #ff450033;
    --glow: 0 0 20px #ff450066;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    background-image:
      radial-gradient(ellipse 80% 40% at 50% 0%, #ff450022 0%, transparent 70%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ff4500' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── AD BANNER ── */
  .ad-banner {
    width: 100%;
    max-width: 480px;
    margin-bottom: 18px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #1a1a24;
    text-align: center;
    animation: fadeIn .6s ease;
  }
  .ad-banner a {
    display: block;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--gold);
    text-decoration: none;
    letter-spacing: .5px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
  }
  .ad-banner a::before { content: '📢 '; }
  .ad-badge {
    display: inline-block;
    font-size: 9px;
    background: var(--fire);
    color: #fff;
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 1px;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    margin-bottom: 24px;
    animation: slideDown .5s ease;
  }
  .logo { font-size: 52px; line-height: 1; filter: drop-shadow(0 0 12px #ff4500); }
  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ff4500, #ffd700, #ff4500);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
    text-transform: uppercase;
  }
  .subtitle { font-size: 13px; color: #aaa; margin-top: 4px; letter-spacing: 1px; }

  /* ── CARD ── */
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 16px;
    box-shadow: var(--glow);
    animation: fadeIn .6s ease;
  }

  /* ── INPUTS ── */
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--fire);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    background: #1a1a28;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color .2s;
  }
  input[type=text]:focus { border-color: var(--fire); }
  input[type=text]::placeholder { color: #555; }

  /* ── STYLE CHIPS ── */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .chip {
    background: #1e1e2e;
    border: 1px solid #333;
    color: #ccc;
    font-size: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: .5px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .chip.active, .chip:hover {
    background: var(--fire);
    border-color: var(--fire);
    color: #fff;
    box-shadow: 0 0 10px #ff450066;
  }

  /* ── BUTTON ── */
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    background: linear-gradient(135deg, #ff4500, #ff6a00);
    color: #fff;
    box-shadow: var(--glow);
    transition: transform .15s, box-shadow .15s;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(.97); }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.15));
  }

  /* ── RESULTS ── */
  .results { display: none; }
  .results.show { display: block; animation: fadeIn .4s ease; }
  .results-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .nick-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .nick-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1a28;
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .nick-item:hover { border-color: var(--fire); background: #1f1f30; }
  .nick-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .5px;
    word-break: break-all;
  }
  .copy-icon { font-size: 16px; flex-shrink: 0; margin-left: 10px; opacity: .6; }
  .nick-item:hover .copy-icon { opacity: 1; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #ff4500;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px 22px;
    border-radius: 30px;
    box-shadow: var(--glow);
    transition: transform .3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── FOOTER ── */
  footer {
    margin-top: 10px;
    font-size: 11px;
    color: #444;
    text-align: center;
    letter-spacing: 1px;
  }

  /* ── ANIMS ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { 0% { background-position: 0% } 100% { background-position: 200% } }
</style>
</head>
<body>

<!-- ══ AD BANNER (Monetag Direct Link) ══ -->
<div class="ad-banner">
  <a href="https://omg10.com/4/11073482" target="_blank" rel="noopener">
    ⚡ Oferta Especial Free Fire — Clique e confira!
    <span class="ad-badge">ADS</span>
  </a>
</div>

<!-- ══ HEADER ══ -->
<header>
  <div class="logo">🔥</div>
  <h1>Gerador de Nicks FF</h1>
  <p class="subtitle">Crie nomes épicos para o Free Fire</p>
</header>

<!-- ══ FORM CARD ══ -->
<div class="card">
  <label for="baseName">Seu nome ou palavra base</label>
  <input type="text" id="baseName" placeholder="Ex: Sniper, Dark, Ana…" maxlength="12"/>

  <label>Estilo do nick</label>
  <div class="chip-row" id="styleChips">
    <div class="chip active" data-style="gamer">🎮 Gamer</div>
    <div class="chip" data-style="pro">⚡ Pro Player</div>
    <div class="chip" data-style="dark">🌑 Dark</div>
    <div class="chip" data-style="kawaii">🌸 Kawaii</div>
    <div class="chip" data-style="symbols">✦ Símbolos</div>
    <div class="chip" data-style="numeros">🔢 Números</div>
  </div>

  <button class="btn" id="generateBtn">🔥 Gerar Nicks</button>
</div>

<!-- ══ RESULTS CARD ══ -->
<div class="card results" id="resultsCard">
  <p class="results-title">✦ Toque para copiar ✦</p>
  <ul class="nick-list" id="nickList"></ul>
</div>

<!-- ══ FOOTER ══ -->
<footer>Free Fire® é marca registrada da Garena • App não oficial</footer>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast">Nick copiado! 🔥</div>

<script>
const prefixesGamer   = ['GodOf','KingOf','Lord','Elite','Pro','Top','Ace','Mega','Ultra','Legend','Noob','Boss'];
const prefixesPro     = ['xX','ッ','彡','「','』','[Pro]','[FF]','[Elite]','Rx','Vx'];
const prefixesDark    = ['Shadow','Dark','Void','Abyss','Death','Skull','Ghost','Night','Phantom','Devil','Sin'];
const prefixesKawaii  = ['Sakura','Hana','Mochi','Neko','Yuki','Chibi','Star','Luna','Kawaii','Angel','Bunny'];
const sufSymbols      = ['ッ','彡','★','•','✦','ツ','꧁','꧂','༺','༻','᪥','乂'];
const sufNumbers      = () => Math.floor(Math.random()*9000)+1000;

function pickRandom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function capitalize(s) { return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }

function generateNicks(base, style) {
  const b = base.trim() ? capitalize(base.trim()) : '';
  const fallbacks = ['Fire','Kill','War','Shot','Storm','Blade','Wolf','Ghost'];
  const word = b || pickRandom(fallbacks);
  const nicks = new Set();

  for (let i = 0; i < 12; i++) {
    let nick = '';
    if (style === 'gamer') {
      nick = pickRandom(prefixesGamer) + word + (Math.random()>.5 ? Math.floor(Math.random()*999) : '');
    } else if (style === 'pro') {
      nick = pickRandom(prefixesPro) + word + pickRandom(prefixesPro);
    } else if (style === 'dark') {
      nick = pickRandom(prefixesDark) + word + (Math.random()>.6 ? Math.floor(Math.random()*99) : '');
    } else if (style === 'kawaii') {
      nick = pickRandom(prefixesKawaii) + word + pickRandom(sufSymbols);
    } else if (style === 'symbols') {
      nick = pickRandom(sufSymbols) + word + pickRandom(sufSymbols) + (Math.random()>.5 ? pickRandom(sufSymbols) : '');
    } else if (style === 'numeros') {
      nick = word + sufNumbers();
    }
    if (nick.length >= 3 && nick.length <= 20) nicks.add(nick);
    if (nicks.size >= 8) break;
  }
  return [...nicks].slice(0, 8);
}

// Chips
let activeStyle = 'gamer';
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeStyle = chip.dataset.style;
  });
});

// Generate
document.getElementById('generateBtn').addEventListener('click', () => {
  const base = document.getElementById('baseName').value;
  const nicks = generateNicks(base, activeStyle);
  const list = document.getElementById('nickList');
  list.innerHTML = '';
  nicks.forEach(n => {
    const li = document.createElement('li');
    li.className = 'nick-item';
    li.innerHTML = `<span class="nick-text">${n}</span><span class="copy-icon">📋</span>`;
    li.addEventListener('click', () => copyNick(n));
    list.appendChild(li);
  });
  document.getElementById('resultsCard').classList.add('show');
  document.getElementById('resultsCard').scrollIntoView({behavior:'smooth', block:'nearest'});
});

// Copy
function copyNick(nick) {
  navigator.clipboard.writeText(nick).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = nick; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const toast = document.getElementById('toast');
  toast.textContent = `"${nick}" copiado! 🔥`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Telegram WebApp init (silently)
try { window.Telegram?.WebApp?.ready(); } catch(e) {}
</script>
</body>
</html>
