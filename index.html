<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Central Premium Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0e1621; color: white; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #2481cc; font-size: 1.6rem; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 0.9rem; margin-top: 0; }
        .box { background: #17212b; padding: 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2b394a; text-align: left; }
        .box h3 { margin-top: 0; color: #f5f6fa; text-align: center; }
        .btn { background: #2481cc; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; display: block; text-decoration: none; box-sizing: border-box; margin-top: 10px; text-align: center; }
        .btn-green { background: #2ecc71; }
        input { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #2481cc; background: #0e1621; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .result { background: #202b36; padding: 15px; margin-top: 15px; border-radius: 5px; display: none; text-align: center; border-left: 4px solid #2481cc; }
        .nick-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #17212b; padding: 8px; border-radius: 4px; }
        .btn-copy { background: #2481cc; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <h1>Central de Utilidades</h1>
    <p>Desbloqueie ferramentas e links premium</p>

    <!-- FERRAMENTA 1: GERADOR DE NICKS -->
    <div class="box">
        <h3>🔥 Gerador de Nicks Raros</h3>
        <input type="text" id="nickInput" placeholder="Digite seu nome ou apelido...">
        <button class="btn" onclick="liberarNick()">Gerar Nick Estiloso</button>
        
        <div id="resultadoNick" class="result">
            <div class="nick-item">
                <span id="n1">꧂ Nome ꧁</span>
                <button class="btn-copy" onclick="copiarNick('n1')">Copiar</button>
            </div>
            <div class="nick-item">
                <span id="n2">⚡ NOME ⚡</span>
                <button class="btn-copy" onclick="copiarNick('n2')">Copiar</button>
            </div>
            <div class="nick-item">
                <span id="n3">☯️ N_O_M_E ☯️</span>
                <button class="btn-copy" onclick="copiarNick('n3')">Copiar</button>
            </div>
        </div>
    </div>

    <!-- FERRAMENTA 2: GRUPOS SECRETOS -->
    <div class="box">
        <h3>🎯 Grupos VIP Telegram</h3>
        <p>Acesse os melhores canais parceiros de achados, memes e ferramentas da semana.</p>
        <!-- SEU ANÚNCIO INSTALADO NO BOTÃO ABAIXO -->
        <a href="https://omg10.com/4/11073482" target="_blank" class="btn btn-green">Ver Lista de Grupos</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // SEU ANÚNCIO INSTALADO NA FUNÇÃO ABAIXO
        const meuAnuncio = "https://omg10.com/4/11073482";

        function liberarNick() {
            const nome = document.getElementById('nickInput').value.trim();
            if(!nome) return alert("Digite um nome primeiro!");

            // Atualiza os exemplos com o nome que o usuário digitou
            document.getElementById('n1').innerText = `꧂ ${nome} ꧁`;
            document.getElementById('n2').innerText = `⚡ ${nome.toUpperCase()} ⚡`;
            document.getElementById('n3').innerText = `☯️ ${nome.split('').join('_')} ☯️`;

            // Abre o seu anúncio da Monetag
            window.open(meuAnuncio, '_blank');

            // Mostra os nicks gerados na tela
            document.getElementById('resultadoNick').style.display = "block";
        }

        function copiarNick(id) {
            const texto = document.getElementById(id).innerText;
            navigator.clipboard.writeText(texto);
            alert("Nick copiado com sucesso!");
        }
    </script>
</body>
</html>
